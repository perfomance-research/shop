<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速結帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">
    
    <div id="app" class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 hidden">
        <h1 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">🛒 您的購物車</h1>
        
        <!-- 購物車清單顯示區 -->
        <div id="cartItems" class="mb-4 space-y-3">
            <!-- 透過 JS 動態產生商品列表 -->
        </div>
        
        <div class="mb-6 border-t pt-4 flex justify-between items-center">
            <p class="text-sm text-gray-500">結帳總金額</p>
            <p id="totalPrice" class="text-2xl font-bold text-red-500">NT$ 0</p>
        </div>

        <button id="checkoutBtn" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
            前往結帳 (LINE Pay / 超商)
        </button>
        <button id="clearCartBtn" class="w-full mt-3 text-gray-500 text-sm hover:text-gray-700 underline">
            清空購物車
        </button>
    </div>

    <script>
        const LIFF_ID = '2009976062-b77cgkLd'; 
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyd3OhZBgw2RalC5iV2MeD-rUpLDmNpsvi9LXGUIidkf4idz5OiQ7w8vGXEZoQt_YaR/exec';

        const products = {
            'A001': { name: '高光澤車體鍍膜維護劑', price: 890 },
            'A002': { name: '頂級棕櫚蠟體驗組', price: 1250 },
            'P001': { name: '5295泡沫氣壓瓶', price: 350 } // <--- 把你的新商品加在這裡！
        };

        let currentUser = {};
        let cart = JSON.parse(localStorage.getItem('myCart')) || []; // 從 LocalStorage 讀取購物車

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                currentUser = {
                    userId: profile.userId,
                    displayName: profile.displayName
                };

                // 檢查網址是否有帶入新商品
                const urlParams = new URLSearchParams(window.location.search);
                const newProductId = urlParams.get('productId');
                
                if (newProductId && products[newProductId]) {
                    // 檢查購物車內是否已有此商品
                    const existingItem = cart.find(item => item.id === newProductId);
                    if (existingItem) {
                        existingItem.qty += 1;
                    } else {
                        cart.push({
                            id: newProductId,
                            name: products[newProductId].name,
                            price: products[newProductId].price,
                            qty: 1
                        });
                    }
                    // 存回 LocalStorage 並清空網址參數(避免重新整理重複加入)
                    localStorage.setItem('myCart', JSON.stringify(cart));
                    window.history.replaceState({}, document.title, window.location.pathname);
                }

                renderCart();
                document.getElementById('app').classList.remove('hidden');

            } catch (err) {
                Swal.fire('系統提示', 'LIFF 初始化失敗: ' + err.message, 'error');
            }
        });

        // 渲染購物車畫面
        function renderCart() {
            const cartContainer = document.getElementById('cartItems');
            const totalEl = document.getElementById('totalPrice');
            cartContainer.innerHTML = '';
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-gray-400 text-center py-4">購物車目前是空的</p>';
                totalEl.innerText = 'NT$ 0';
                document.getElementById('checkoutBtn').disabled = true;
                document.getElementById('checkoutBtn').classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            let total = 0;
            let cartHtml = '';
            cart.forEach(item => {
                total += item.price * item.qty;
                cartHtml += `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded">
                        <div>
                            <p class="text-sm font-semibold text-gray-700">${item.name}</p>
                            <p class="text-xs text-gray-500">NT$ ${item.price} x ${item.qty}</p>
                        </div>
                        <p class="font-bold text-gray-800">NT$ ${item.price * item.qty}</p>
                    </div>
                `;
            });

            cartContainer.innerHTML = cartHtml;
            totalEl.innerText = `NT$ ${total}`;
            document.getElementById('checkoutBtn').disabled = false;
            document.getElementById('checkoutBtn').classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // 清空購物車
        document.getElementById('clearCartBtn').addEventListener('click', () => {
            cart = [];
            localStorage.removeItem('myCart');
            renderCart();
        });

        // 點擊結帳按鈕事件
        document.getElementById('checkoutBtn').addEventListener('click', async () => {
            Swal.fire({
                title: '建立訂單中...',
                text: '請稍候，安全連線至金流中心',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                // 將購物車商品轉為字串，方便存入 Google Sheets
                const itemNames = cart.map(item => `${item.name} x${item.qty}`).join(', ');
                const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                const payload = {
                    action: 'createOrder',
                    userId: currentUser.userId,
                    displayName: currentUser.displayName,
                    cartDetails: JSON.stringify(cart), // 詳細 JSON 存入資料庫
                    productName: itemNames,            // 組合名稱給綠界與試算表顯示
                    amount: totalAmount,
                    shippingMethod: '預設'
                };

                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    // 結帳前清空 LocalStorage 的購物車
                    localStorage.removeItem('myCart');
                    submitToECPay(result.ecpayUrl, result.ecpayParams);
                } else {
                    throw new Error(result.message);
                }

            } catch (err) {
                Swal.fire('結帳發生錯誤', err.message, 'error');
            }
        });

        function submitToECPay(actionUrl, params) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = actionUrl;
            for (const key in params) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = params[key];
                form.appendChild(input);
            }
            document.body.appendChild(form);
            form.submit();
        }
    </script>
</body>
</html>
